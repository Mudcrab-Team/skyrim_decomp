name: Refresh trend charts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# One refresh at a time; a newer push supersedes a queued one because the job
# always regenerates from the latest main.
concurrency:
  group: refresh-trend
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Reads only first-parent history and committed data; the README totals table is rewritten too.
      - run: python3 tools/build_model_trend.py
      - name: Commit changes
        run: |
          if git diff --quiet -- docs/model-trend.svg docs/progress-trend.svg README.md; then
            echo "trend charts are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/model-trend.svg docs/progress-trend.svg README.md
          # Pushes made with GITHUB_TOKEN do not start workflows; [skip ci] also guards
          # against a swapped-in token re-triggering this job.
          git commit -m "Refresh trend charts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
