name: Infrastructure checks
on:
  push:
    # Candidate branches for second-host confirmation are validated by the dispatched confirm
    # workflow; running the full suite on each of them is pure waste and no gate reads it.
    branches-ignore: ['ci-confirm/**']
  pull_request:
    # Reconstruction-only PRs are covered by pr-check (scope + hash); nothing here reads them.
    paths-ignore: ['reconstruction/**']
# A newer push to the same branch or PR supersedes an older run. Main keeps one run per
# commit so every main SHA still gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      mapping: ${{ steps.diff.outputs.mapping }}
    steps:
      # Only a pull request diffs anything; a push answers from the event name alone.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The shards only exercise tools; PRs that touch just data, docs or reconstruction skip them.
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; echo mapping=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # A mapping-only PR omits the generated index and pictures, which the bot regenerates after the
          # merge, so the full check would fail it on staleness; the mapping job of pr-check is its gate.
          mapping=$(git diff --no-renames --name-status "$BASE...$HEAD" | awk -F'\t' '
            $1=="M" && $2=="data/progress.json" {p=1; next}
            $1=="A" && $2 ~ /^findings\/[^\/]+\.md$/ {next}
            {bad=1}
            END {print (p && !bad) ? "true" : "false"}')
          echo "mapping=$mapping" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(reconstruction/|data/|docs/)|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.mapping != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: git diff --check
      # Verified publication scans, keyed by blob content and the exact scanner and policy, so an
      # entry can only ever answer for the bytes it was computed from. Only main writes it back.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/revision-cache/publication-blobs.sqlite3
          key: scan-cache-${{ github.sha }}
          restore-keys: scan-cache-
      # check.py's scan and validation, then the site from the same validated data, with the
      # history trend computed in a second process meanwhile. See tools/ci_check.py.
      - run: python3 tools/ci_check.py
        env:
          SR_REVISION_CACHE_PRUNE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/revision-cache/publication-blobs.sqlite3
          key: scan-cache-${{ github.sha }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: checked-site
          path: dist
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs even if another fails; workflow success requires all eight.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python3 tools/test_suite.py --jobs 2 --shard-index ${{ matrix.shard }} --shard-count 8
