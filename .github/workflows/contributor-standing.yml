name: Contributor standing
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  contributor-standing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Read-only fork check is attached to the PR head, using trusted base tools/data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python3 tools/contributor_standing.py --event "$GITHUB_EVENT_PATH"
  label-standing:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This privileged job runs default-branch code only. No PR checkout or artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check standing and label three active strikes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/contributor_standing.py --event "$GITHUB_EVENT_PATH" --apply-label
